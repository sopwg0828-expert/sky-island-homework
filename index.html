<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#bfe0f4">
  <title>空中之島 · 我的方塊世界</title>
  <meta name="description" content="探索草地浮島，按住左鍵挖碎方塊，走近拾取材料。">
  <link rel="icon" href="assets/source/sky-island-assets/icons/grass.png">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main id="app">
    <canvas id="world" aria-label="空中之島立體場景" tabindex="0"></canvas>
    <header class="topbar">
      <a class="brand" href="./" aria-label="空中之島首頁"><img src="assets/source/sky-island-assets/icons/grass.png" alt=""><span>空中之島</span></a>
      <div class="top-actions"><span class="stage">建造小島<span class="stage-name">挖・掉・撿・放</span></span><button id="fullscreen" class="icon-button" aria-label="切換全螢幕" title="切換全螢幕"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></svg></button><button id="pause" class="quiet-button" hidden>暫停</button></div>
    </header>
    <section id="welcome" class="welcome" aria-labelledby="title">
      <h1 id="title">在雲之上，<br>有一座我的島。</h1>
      <p class="intro">一片草地，一條河流。<br>從腳下的第一步，開始探索空中之島。</p>
      <button id="start" class="primary-button" disabled><span id="start-label">正在準備小島…</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></button>
      <p class="scope-note">左鍵挖掘，走近拾取，選材料後右鍵放回。搭橋驗收尚未完成。</p>
    </section>
    <div id="crosshair" class="crosshair" hidden aria-hidden="true"></div>
    <aside id="walk-guide" class="walk-guide" hidden><strong>移動滑鼠轉向，中央準心瞄準。</strong><span>WASD 走路，空白鍵跳躍，Esc 暫停。<br>草地／泥土挖 0.8 秒，石頭挖 2 秒。<br>走近拾取，1／2／3 選材料，右鍵放置。<br>島底基岩挖不掉；挖開河岸會進水。<br>小心河流！踩進去會被沖出島外。</span></aside>
    <section id="mining-panel" class="mining-panel" hidden aria-label="挖掘狀態"><strong id="mining-label">把準星移到附近的方塊</strong><div id="mining-meter" class="mining-meter" role="progressbar" aria-label="挖掘進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="mining-progress"></span></div><span id="mining-hint">挖碎後，走近掉落的小方塊就能收進背包</span></section>
    <section id="inventory" class="inventory" hidden aria-label="材料背包"><span class="inventory-title">選材料・右鍵放置</span><div class="inventory-slots"><button class="inventory-slot" data-material="1" aria-label="選擇草地方塊" aria-pressed="true"><img src="assets/source/sky-island-assets/icons/grass.png" alt=""><span>1 草地</span><strong id="count-1" aria-label="草地數量">0</strong></button><button class="inventory-slot" data-material="2" aria-label="選擇泥土" aria-pressed="false"><img src="assets/source/sky-island-assets/icons/dirt.png" alt=""><span>2 泥土</span><strong id="count-2" aria-label="泥土數量">0</strong></button><button class="inventory-slot" data-material="3" aria-label="選擇石頭" aria-pressed="false"><img src="assets/source/sky-island-assets/icons/stone.png" alt=""><span>3 石頭</span><strong id="count-3" aria-label="石頭數量">0</strong></button></div></section>
    <div id="notice" role="status" aria-live="polite" class="notice" hidden></div>
    <footer class="bottom-bar">
      <div class="controls"><div class="control-item"><span class="key-group"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span><span>移動</span></div><div class="control-item"><svg viewBox="0 0 20 24" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="3" y="2" width="14" height="20" rx="7"/><path d="M10 2v7"/></svg><span>滑鼠轉向・左鍵挖・右鍵放</span></div><div class="control-item keyboard-look"><span class="key-group"><kbd>Space</kbd></span><span>跳躍</span></div></div>
      <div class="world-note"><span class="live-dot"></span><span id="world-status">正在載入</span><span id="fps" class="fps"></span></div>
    </footer>
    <div id="touch-controls" class="touch-controls" hidden aria-label="觸控移動"><button data-move="forward" aria-label="向前走">↑</button><div><button data-move="left" aria-label="向左走">←</button><button data-move="back" aria-label="向後走">↓</button><button data-move="right" aria-label="向右走">→</button></div></div>
    <button id="touch-mine" class="touch-mine" hidden>按住挖掘</button>
    <button id="touch-jump" class="touch-jump" hidden>跳躍</button>
    <section id="error" class="error" role="alert" hidden><h2>小島暫時無法開啟</h2><p id="error-message"></p><button class="primary-button" onclick="location.reload()">重新載入</button></section>
  </main>
</body>
</html>
