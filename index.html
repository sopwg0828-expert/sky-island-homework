<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#bfe0f4">
  <title>空中之島 · 我的方塊世界</title>
  <meta name="description" content="探索草地浮島，按住左鍵挖碎方塊，走近拾取材料。">
  <link rel="icon" href="assets/source/sky-island-assets/icons/grass.png">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main id="app">
    <canvas id="world" aria-label="空中之島立體場景" tabindex="0"></canvas>
    <header class="topbar">
      <a class="brand" href="./" aria-label="空中之島首頁"><img src="assets/source/sky-island-assets/icons/grass.png" alt=""><span>空中之島</span></a>
      <div class="top-actions"><span class="stage">採集材料<span class="stage-name">挖掘・掉落・拾取</span></span><button id="fullscreen" class="icon-button" aria-label="切換全螢幕" title="切換全螢幕"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></svg></button><button id="pause" class="quiet-button" hidden>暫停</button></div>
    </header>
    <section id="welcome" class="welcome" aria-labelledby="title">
      <h1 id="title">在雲之上，<br>有一座我的島。</h1>
      <p class="intro">一片草地，一條河流。<br>從腳下的第一步，開始探索空中之島。</p>
      <button id="start" class="primary-button" disabled><span id="start-label">正在準備小島…</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></button>
      <p class="scope-note">按住左鍵挖掘，走近拾取材料。放置與搭橋將在後續完成。</p>
    </section>
    <div id="crosshair" class="crosshair" hidden aria-hidden="true"></div>
    <aside id="walk-guide" class="walk-guide" hidden><strong>先收集材料，為搭橋做準備。</strong><span>草地、泥土：按住左鍵 0.8 秒<br>石頭：按住左鍵 2 秒<br>放開就要重挖；走近小方塊會自動拾取。<br>按住右鍵拖曳轉向，掉下島材料歸零。</span></aside>
    <section id="mining-panel" class="mining-panel" hidden aria-label="挖掘狀態"><strong id="mining-label">把準星移到附近的方塊</strong><div id="mining-meter" class="mining-meter" role="progressbar" aria-label="挖掘進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="mining-progress"></span></div><span id="mining-hint">挖碎後，走近掉落的小方塊就能收進背包</span></section>
    <section id="inventory" class="inventory" hidden aria-label="材料背包"><span class="inventory-title">材料背包</span><div class="inventory-slots"><div class="inventory-slot"><img src="assets/source/sky-island-assets/icons/grass.png" alt=""><span>草地</span><strong id="count-1" aria-label="草地數量">0</strong></div><div class="inventory-slot"><img src="assets/source/sky-island-assets/icons/dirt.png" alt=""><span>泥土</span><strong id="count-2" aria-label="泥土數量">0</strong></div><div class="inventory-slot"><img src="assets/source/sky-island-assets/icons/stone.png" alt=""><span>石頭</span><strong id="count-3" aria-label="石頭數量">0</strong></div></div></section>
    <div id="notice" role="status" aria-live="polite" class="notice" hidden></div>
    <footer class="bottom-bar">
      <div class="controls"><div class="control-item"><span class="key-group"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span><span>移動</span></div><div class="control-item"><svg viewBox="0 0 20 24" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="3" y="2" width="14" height="20" rx="7"/><path d="M10 2v7"/></svg><span>左鍵挖掘・右鍵拖曳轉向</span></div><div class="control-item keyboard-look"><span class="key-group"><kbd>←</kbd><kbd>→</kbd></span><span>轉向</span></div></div>
      <div class="world-note"><span class="live-dot"></span><span id="world-status">正在載入</span><span id="fps" class="fps"></span></div>
    </footer>
    <div id="touch-controls" class="touch-controls" hidden aria-label="觸控移動"><button data-move="forward" aria-label="向前走">↑</button><div><button data-move="left" aria-label="向左走">←</button><button data-move="back" aria-label="向後走">↓</button><button data-move="right" aria-label="向右走">→</button></div></div>
    <button id="touch-mine" class="touch-mine" hidden>按住挖掘</button>
    <section id="error" class="error" role="alert" hidden><h2>小島暫時無法開啟</h2><p id="error-message"></p><button class="primary-button" onclick="location.reload()">重新載入</button></section>
  </main>
</body>
</html>
